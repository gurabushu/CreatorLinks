version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: creator_links_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: creator_pass
      POSTGRES_DB: creator_links_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U creator -d creator_links_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
